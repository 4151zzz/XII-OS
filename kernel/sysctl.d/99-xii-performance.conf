# XII OS Desktop Responsiveness & Memory Optimization Sysctl
# Designed for low RAM consumption and fast interactive feel

# 1. Virtual Memory & Swapping
# Reduce aggressive swapping to disk (default is 60, optimal for desktop is 10-15)
vm.swappiness = 15

# Tendency of the kernel to reclaim the memory which is used for caching of VFS caches
vm.vfs_cache_pressure = 50

# Percentage of system memory that can be filled with "dirty" pages before pdflush starts writing them to disk
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# 2. File System Inotify Limits
# Crucial for modern desktop environments, file managers, and code editors
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# 3. Kernel & Scheduler responsiveness
# Reduce printk verbosity on console
kernel.printk = 3 4 1 3

# Improve responsiveness under I/O load
kernel.sched_autogroup_enabled = 1
