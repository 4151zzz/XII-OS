<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="xii-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="#0A0B10" />

  <!-- Subtle Outer Ring -->
  <circle cx="256" cy="256" r="210" stroke="url(#xii-gradient)" stroke-width="2" stroke-opacity="0.3" fill="none" />

  <!-- XII Geometric Emblem -->
  <g filter="url(#glow)">
    <!-- 'X' Glyph -->
    <path d="M140 160 L240 352 M240 160 L140 352" 
          stroke="url(#xii-gradient)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- First 'I' Glyph -->
    <path d="M290 160 L290 352" 
          stroke="url(#xii-gradient)" 
          stroke-width="30" 
          stroke-linecap="round" />

    <!-- Second 'I' Glyph -->
    <path d="M350 160 L350 352" 
          stroke="url(#xii-gradient)" 
          stroke-width="30" 
          stroke-linecap="round" />
  </g>

  <!-- OS Subtitle -->
  <text x="256" y="420" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="600" 
        letter-spacing="6" 
        fill="#E2E8F0">
    XII OS
  </text>
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="12" 
        font-weight="400" 
        letter-spacing="3" 
        fill="#94A3B8">
    BEAUTIFUL • LIGHTWEIGHT • INTELLIGENT
  </text>
</svg>
