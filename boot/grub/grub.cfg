# GRUB Configuration for XII OS
# Beautiful. Lightweight. Intelligent.

set default="0"
set timeout=5
set timeout_style=menu

# Color and visual styling
set menu_color_normal=light-gray/black
set menu_color_highlight=cyan/black
set color_normal=light-gray/black
set color_highlight=cyan/black

insmod ext2
insmod fat
insmod iso9660
insmod gzio
insmod part_gpt
insmod part_msdos
insmod all_video
insmod gfxterm

# Set resolution
set gfxmode=auto
terminal_output gfxterm

menuentry "XII OS — Standard Mode (Default)" --class xii-os --class gnu-linux --class os {
    echo "Loading XII OS Linux Kernel (Standard Mode)..."
    linux /boot/vmlinuz quiet splash loglevel=3 xii.mode=standard mitigations=auto
    echo "Loading XII OS Initial Ramdisk..."
    initrd /boot/initrd.img
}

menuentry "XII OS — Lite Mode (Optimized for Low-Resource Hardware)" --class xii-os-lite --class gnu-linux --class os {
    echo "Loading XII OS Linux Kernel (Lite Mode)..."
    linux /boot/vmlinuz quiet splash loglevel=3 xii.mode=lite mitigations=auto zswap.enabled=1
    echo "Loading XII OS Initial Ramdisk..."
    initrd /boot/initrd.img
}

menuentry "XII OS — Performance Mode (Full GPU & Maximum Throughput)" --class xii-os-perf --class gnu-linux --class os {
    echo "Loading XII OS Linux Kernel (Performance Mode)..."
    linux /boot/vmlinuz quiet splash loglevel=3 xii.mode=performance cpufreq.default_governor=performance
    echo "Loading XII OS Initial Ramdisk..."
    initrd /boot/initrd.img
}

menuentry "XII OS — Recovery & Safe Diagnostics Mode" --class xii-os-recovery --class gnu-linux --class os {
    echo "Loading XII OS in Safe Recovery Mode..."
    linux /boot/vmlinuz single nomodeset loglevel=7 xii.mode=recovery
    echo "Loading XII OS Initial Ramdisk..."
    initrd /boot/initrd.img
}

submenu "Advanced Boot Options for XII OS" {
    menuentry "XII OS — Safe Graphics (nomodeset)" {
        linux /boot/vmlinuz nomodeset loglevel=4 xii.mode=standard
        initrd /boot/initrd.img
    }

    menuentry "System Restart" {
        reboot
    }

    menuentry "System Shutdown" {
        halt
    }
}
