# XII OS — pytest configuration
# Place at project root for `pytest` to discover tests automatically

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --no-header
    -q
console_output_style = progress

# Fail on any unexpected warnings from XII OS test code
filterwarnings =
    error::DeprecationWarning
