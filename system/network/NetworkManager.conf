# =============================================================
# XII OS — NetworkManager Configuration
# system/network/NetworkManager.conf
#
# Main configuration for NetworkManager on XII OS.
# Install location: /etc/NetworkManager/NetworkManager.conf
# =============================================================

[main]
# Use systemd-resolved for DNS
dns=systemd-resolved

# Manage all interfaces by default
no-auto-default=*

# Use random MAC for privacy
wifi.mac-address-randomization=always
ethernet.mac-address-randomization=never

# IWD (iNet Wireless Daemon) as Wi-Fi backend — faster, more power-efficient
wifi.backend=iwd

# Connection file format
plugins=keyfile

# Use libnm for better GTK4 integration
[connectivity]
uri=http://connectivity-check.xii-os.org/check
response=OK
interval=300

[logging]
level=WARN
domains=ALL

[keyfile]
path=/etc/NetworkManager/system-connections
unmanaged-devices=interface-name:lo

[ifupdown]
managed=false

[device]
wifi.scan-rand-mac-address=yes
