# =============================================================
# XII OS — PipeWire Audio Configuration
# system/audio/pipewire.conf
#
# Main PipeWire configuration for XII OS.
# Tuned for low latency + high quality + power efficiency.
#
# Install: /usr/share/pipewire/pipewire.conf  (or ~/.config/pipewire/)
# =============================================================

context.properties = {
    # XII OS audio identity
    application.name       = "XII OS Audio Server"
    application.icon.name  = "audio-card"

    # Core clock: 48 kHz is standard for modern audio
    default.clock.rate      = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 192000 ]

    # Quantum (buffer size): 256 frames = ~5.3ms latency at 48kHz
    # Lite mode can use 1024 for better battery
    default.clock.quantum      = 256
    default.clock.min-quantum  = 32
    default.clock.max-quantum  = 8192

    # Allow clients to request lower latency
    core.daemon = true
}

context.spa-libs = {
    audio.convert.*     = audioconvert/libspa-audioconvert
    api.alsa.*          = alsa/libspa-alsa
    api.v4l2.*          = v4l2/libspa-v4l2
    api.libcamera.*     = libcamera/libspa-libcamera
    api.bluez5.*        = bluez5/libspa-bluez5
    support.*           = support/libspa-support
}

context.modules = [
    # Core RT scheduling
    { name = libpipewire-module-rt
      args = { nice.level = -11  rt.prio = 88  rt.time.soft = -1  rt.time.hard = -1 }
      flags = [ ifexists nofail ]
    }

    # D-Bus for WirePlumber session manager
    { name = libpipewire-module-dbus-connection }

    # Clock API
    { name = libpipewire-module-clock-importer }

    # ALSA backend for hardware devices
    { name = libpipewire-module-adapter }

    # Bluetooth (BlueZ 5) with AAC/aptX/aptX-HD/LDAC codecs
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-profiler }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-spa-device-factory }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-client-device }

    # Session manager interface
    { name = libpipewire-module-portal  flags = [ ifexists nofail ] }
    { name = libpipewire-module-access  args = {} }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-session-manager }
]

# PulseAudio compatibility layer (for legacy apps)
context.exec = [
    { path = "/usr/bin/pipewire-pulse"  args = "" }
]
