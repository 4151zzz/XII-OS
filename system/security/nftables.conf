#!/usr/sbin/nft -f
# =============================================================
# XII OS — nftables Firewall Ruleset
# system/security/nftables.conf
#
# A stateful firewall for XII OS workstations.
# Applies principle of least privilege:
#   - Inbound: block all except established, loopback, ICMP
#   - Outbound: allow all (user workstation policy)
#   - Forward:  drop all (not a router)
#
# Install: /etc/nftables.conf
# Apply:   systemctl enable --now nftables
#          nft -f /etc/nftables.conf
# =============================================================

flush ruleset

# ─────────────────────────────────────────────────────────────
# IPv4 + IPv6 — main filter table
# ─────────────────────────────────────────────────────────────
table inet xii_filter {

  # ── Connection tracking — shared sets ───────────────────────
  set blocked_ips {
    type ipv4_addr
    flags dynamic, timeout
    timeout 1h
    comment "Automatically blocked IPs (failed auth etc.)"
  }

  set blocked_ips6 {
    type ipv6_addr
    flags dynamic, timeout
    timeout 1h
    comment "Blocked IPv6 addresses"
  }

  # ── Inbound ──────────────────────────────────────────────────
  chain inbound {
    type filter hook input priority filter; policy drop;

    # Loopback — always allow
    iifname "lo" accept comment "Loopback interface"

    # Drop blocked IPs early
    ip  saddr @blocked_ips  drop comment "Blocked IPs"
    ip6 saddr @blocked_ips6 drop comment "Blocked IPv6"

    # Established/Related connections
    ct state established,related accept comment "Established connections"

    # Invalid packets — drop
    ct state invalid drop comment "Invalid packets"

    # ICMP — allow ping and necessary ICMPv6
    ip  protocol icmp   accept    comment "ICMPv4"
    ip6 nexthdr  icmpv6 accept    comment "ICMPv6 (ND, router, etc.)"

    # mDNS for local service discovery (avahi)
    udp dport 5353 accept comment "mDNS"

    # XII OS local services (only from LAN — adjust as needed)
    # Uncomment to allow SSH from LAN:
    # ip saddr 192.168.0.0/16 tcp dport 22 accept comment "SSH from LAN"

    # Reject everything else with ICMP unreachable (friendly)
    reject with icmpx type port-unreachable
  }

  # ── Outbound ─────────────────────────────────────────────────
  chain outbound {
    type filter hook output priority filter; policy accept;
    # Allow all outbound — workstation policy
    # Add specific blocks here if needed
  }

  # ── Forward ──────────────────────────────────────────────────
  chain forward {
    type filter hook forward priority filter; policy drop;
    # XII OS is a workstation, not a router
  }
}

# ─────────────────────────────────────────────────────────────
