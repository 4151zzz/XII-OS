# =============================================================
# XII OS — BlueZ (Bluetooth) Configuration
# system/bluetooth/main.conf
#
# Install location: /etc/bluetooth/main.conf
# =============================================================

[General]
# Device name as seen by other Bluetooth devices
Name = XII OS

# Device class: Desktop Computer
Class = 0x000100

# Scan interval and window (LE advertising)
DiscoverableTimeout = 180
PairableTimeout = 120

# Enable LE (Bluetooth Low Energy) for modern peripherals
ControllerMode = dual

# Auto-reconnect to known devices on power up
AutoConnect = true

# Use experimental features (enables more BT 5.x features)
Experimental = true

# Power on adapter at boot
FastConnectable = true

[Policy]
# Auto-enable Bluetooth on startup
AutoEnable = true

# Reconnect strategy: timeout in seconds per attempt
ReconnectAttempts = 7
ReconnectIntervals = 1, 2, 4, 8, 16, 32, 64

[LE]
# Minimum/Maximum connection interval (1.25ms units)
MinConnectionInterval = 7
MaxConnectionInterval = 9
ConnectionLatency = 0
ConnectionSupervisionTimeout = 720

# Privacy: rotate random address every 15 minutes
Privacy = device
