# =============================================================
# XII OS — Mako Notification Daemon Configuration
# desktop/notifications/mako.conf
#
# Mako is the standard notification daemon for wlroots-based
# Wayland compositors. This config implements XII OS's
# glassmorphic notification design.
#
# Install: sudo apt install mako-notifier
# Config:  ~/.config/mako/config
#       OR /etc/xii-os/desktop/notifications/mako.conf
# =============================================================

# ─────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────
sort=-time
layer=overlay
anchor=top-right

max-icon-size=48
icon-path=/usr/share/icons/hicolor:/usr/share/icons/Papirus-Dark
icons=1

# Notification lifetime
default-timeout=5000
ignore-timeout=0

# Max notifications on screen
max-history=100
max-visible=5

# ─────────────────────────────────────────────────────────────
# Layout
# ─────────────────────────────────────────────────────────────
width=360
height=200
margin=12,12,0,0
padding=14,14,14,14
border-size=1
border-radius=14

# ─────────────────────────────────────────────────────────────
# XII OS Glassmorphic Design
# ─────────────────────────────────────────────────────────────
background-color=#0a0a14cc
text-color=#dcdce8
border-color=#ffffff1e

font=Inter 13

# Left accent bar (via border-left hack)
outer-margin=0

# ─────────────────────────────────────────────────────────────
# Urgency: Low
# ─────────────────────────────────────────────────────────────
[urgency=low]
background-color=#0a0a12bb
text-color=#909098
border-color=#ffffff12
default-timeout=3000

# ─────────────────────────────────────────────────────────────
# Urgency: Normal (default)
# ─────────────────────────────────────────────────────────────
[urgency=normal]
background-color=#0a0a14cc
text-color=#dcdce8
border-color=#ffffff1e
default-timeout=5000

# ─────────────────────────────────────────────────────────────
# Urgency: Critical
# ─────────────────────────────────────────────────────────────
[urgency=critical]
background-color=#1a080aee
text-color=#ffb0b8
border-color=#f87171aa
border-size=2
default-timeout=0

# ─────────────────────────────────────────────────────────────
# App-specific overrides
# ─────────────────────────────────────────────────────────────
[app-name=xii-ai]
background-color=#0a0a1acc
border-color=#a78bfa44
text-color=#c4b5fd

[app-name=battery]
[urgency=critical]
background-color=#1a0f00ee
border-color=#facc15aa
text-color=#fcd34d

[app-name=NetworkManager]
border-color=#6ee7f744
