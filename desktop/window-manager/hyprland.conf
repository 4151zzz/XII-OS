# =============================================================
# XII OS — Hyprland Wayland Compositor Configuration
# desktop/window-manager/hyprland.conf
#
# Hyprland is a dynamic tiling Wayland compositor built on
# wlroots. This config applies XII OS's visual design:
#   - Rounded corners & elegant border glow
#   - Smooth spring animations
#   - 3-monitor workspace layout
#   - XII keybindings
#   - Performance Mode adaptations
#
# Install: https://hyprland.org
# Config location: ~/.config/hypr/hyprland.conf
#              OR: /etc/xii-os/desktop/hyprland.conf (system)
# =============================================================

# ─────────────────────────────────────────────────────────────
# MONITOR LAYOUT
# ─────────────────────────────────────────────────────────────
# Format: monitor=<name>,<resolution>@<hz>,<position>,<scale>
monitor = , preferred, auto, 1           # Auto-detect all monitors
# monitor = DP-1, 2560x1440@165, 0x0, 1  # Example: primary 1440p 165Hz
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1  # Example: secondary

# ─────────────────────────────────────────────────────────────
# AUTOSTART APPLICATIONS
# ─────────────────────────────────────────────────────────────
exec-once = xii-statusbar                 # XII OS Status Bar (Waybar)
exec-once = xii-dock                      # XII OS Dock daemon
exec-once = xii-notifications             # XII Notification center
exec-once = swaybg -i /usr/share/xii-os/wallpapers/xii-default.png -m fill
exec-once = /usr/lib/xii-os/xii-init.sh  # XII OS boot services
exec-once = nm-applet --indicator         # Network Manager tray
exec-once = blueman-applet                # Bluetooth tray
exec-once = pipewire                      # Audio (PipeWire)
exec-once = wireplumber                   # PipeWire session manager
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# ─────────────────────────────────────────────────────────────
# ENVIRONMENT VARIABLES
# ─────────────────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

env = GDK_BACKEND,wayland,x11
env = GDK_SCALE,1

env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DBUS_REMOTE,1

env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland

env = GTK_THEME,XII-OS-Dark
env = XCURSOR_THEME,XII-Cursors
env = XCURSOR_SIZE,24

env = XII_MODE_ACTIVE,standard           # Read by XII services

# ─────────────────────────────────────────────────────────────
# INPUT DEVICES
# ─────────────────────────────────────────────────────────────
input {
    kb_layout  = us
    kb_variant =
    kb_model   =
    kb_options = caps:escape              # Caps Lock → Escape

    follow_mouse     = 1
    mouse_refocus    = false
    float_switch_override_focus = 2

    sensitivity = 0.0                    # Mouse sensitivity (-1 to 1)
    accel_profile = flat

    touchpad {
        natural_scroll    = yes
        disable_while_typing = yes
        tap-to-click      = yes
        drag_lock         = yes
        scroll_factor     = 0.8
        clickfinger_behavior = true
    }
}

# ─────────────────────────────────────────────────────────────
# XII OS VISUAL DESIGN
# ─────────────────────────────────────────────────────────────
general {
    gaps_in  = 5                         # Gaps between windows
    gaps_out = 10                        # Gaps between windows and screen edge
    border_size = 1

    # XII Cyan border for active window
    col.active_border   = rgba(6ee7f7ff) rgba(a78bfaff) 45deg
    col.inactive_border = rgba(1a1a2e80)

    layout = dwindle
    resize_on_border        = true
    no_focus_fallback       = false
    allow_tearing           = false     # No screen tearing (set true for Gaming mode)
}

decoration {
    rounding          = 14              # Rounded corners (XII radius-lg)
    rounding_power    = 2.0

    # Active window shadow — cyan glow
    shadow {
        enabled      = true
        range        = 30
        render_power = 3
        color        = rgba(6ee7f720)
        color_inactive = rgba(00000040)
        offset       = 0, 4
    }

    # Glassmorphism blur
    blur {
        enabled        = true
        size           = 12
        passes         = 3
        new_optimizations = true
        xray           = false
        ignore_opacity = false
        noise          = 0.0117
        contrast       = 1.0
        brightness     = 0.8
        vibrancy       = 0.2
        vibrancy_darkness = 0.5
    }

    active_opacity   = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0

    dim_inactive  = true
    dim_strength  = 0.06
}

animations {
    enabled = true

    # XII Spring animation curve
    bezier = xii_spring, 0.175, 0.885, 0.32, 1.275
    bezier = xii_smooth, 0.25, 0.46, 0.45, 0.94
    bezier = xii_ease,   0.4, 0, 0.2, 1
    bezier = xii_in,     0.4, 0, 1, 1
    bezier = xii_out,    0.0, 0, 0.2, 1

    # Window animations
    animation = windows,     1, 5,  xii_spring
    animation = windowsIn,   1, 5,  xii_spring, slide
    animation = windowsOut,  1, 4,  xii_ease,   slide
    animation = windowsMove, 1, 5,  xii_smooth

    # Layer (status bar, launcher, dock)
    animation = layers,      1, 4,  xii_spring
    animation = layersIn,    1, 4,  xii_spring, fade
    animation = layersOut,   1, 3,  xii_ease,   fade

    # Workspace switching
    animation = workspaces,  1, 5,  xii_smooth, slide
    animation = specialWorkspace, 1, 5, xii_spring, slidevert

    # Fade
    animation = fade,        1, 5,  xii_ease
    animation = fadeIn,      1, 5,  xii_ease
    animation = fadeOut,     1, 4,  xii_in
    animation = fadeDim,     1, 5,  xii_ease

    # Border
    animation = border,      1, 8,  xii_smooth
    animation = borderangle, 1, 120, linear, loop
}

# ─────────────────────────────────────────────────────────────
# LAYOUTS
# ─────────────────────────────────────────────────────────────
dwindle {
    pseudotile         = true           # Press XII + P to toggle
    preserve_split     = true
    smart_split        = true
    smart_resizing     = true
}

master {
    new_status         = master
    new_on_top         = true
    mfact              = 0.55
}

# ─────────────────────────────────────────────────────────────
# GESTURES (Touchpad / Touchscreen)
# ─────────────────────────────────────────────────────────────
gestures {
    workspace_swipe          = true
    workspace_swipe_fingers  = 3
    workspace_swipe_distance = 300
    workspace_swipe_invert   = true
    workspace_swipe_min_speed_to_force = 30
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new   = true
    workspace_swipe_forever      = false
}

# ─────────────────────────────────────────────────────────────
# MISCELLANEOUS
# ─────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper   = 0       # Disable Hyprland default wallpaper
    disable_hyprland_logo     = true
    disable_splash_rendering  = true

    key_press_enables_dpms    = true
    mouse_move_enables_dpms   = true

    focus_on_activate         = true
    no_direct_scanout         = false
    animate_manual_resizes    = true
    animate_mouse_windowdragging = true

    enable_swallow            = true
    swallow_regex             = ^(xii-terminal|kitty|foot)$

    vfr = true                          # Variable frame rate — saves power
}

# ─────────────────────────────────────────────────────────────
# WINDOW RULES
# ─────────────────────────────────────────────────────────────

# XII Launcher — floating center
windowrulev2 = float,       class:^(xii-launcher)$
windowrulev2 = size 680 480, class:^(xii-launcher)$
windowrulev2 = center,      class:^(xii-launcher)$
windowrulev2 = animation slide, class:^(xii-launcher)$

# XII Settings — floating
windowrulev2 = float,       class:^(xii-settings)$
windowrulev2 = size 900 620, class:^(xii-settings)$
windowrulev2 = center,      class:^(xii-settings)$

# XII File Manager — tile
windowrulev2 = tile,        class:^(xii-files)$

# Dialogs — float centered
windowrulev2 = float,       class:^(.*dialog.*)$
windowrulev2 = center,      class:^(.*dialog.*)$
windowrulev2 = size 460 300, class:^(.*dialog.*)$

# File chooser
windowrulev2 = float,       title:^(Open|Save|Export).*$
windowrulev2 = center,      title:^(Open|Save|Export).*$
windowrulev2 = size 900 600, title:^(Open|Save|Export).*$

# Picture-in-Picture
windowrulev2 = float,       title:^(Picture-in-Picture)$
windowrulev2 = pin,         title:^(Picture-in-Picture)$
windowrulev2 = size 480 270, title:^(Picture-in-Picture)$
windowrulev2 = move 100%- 100%-, title:^(Picture-in-Picture)$

# Steam / games — no rounding on fullscreen
windowrulev2 = rounding 0, fullscreen:1
windowrulev2 = noshadow,   fullscreen:1

# Opacity rules for inactive windows
windowrulev2 = opacity 1.0 override 0.92 override, class:^(xii-terminal|kitty|foot)$

# ─────────────────────────────────────────────────────────────
# WORKSPACES
# ─────────────────────────────────────────────────────────────
workspace = 1, default:true
workspace = 2
workspace = 3
workspace = 4
workspace = 5
workspace = 6
workspace = 7
workspace = 8
workspace = 9
workspace = 10

# Special workspace — scratchpad
workspace = special:scratch, on-created-empty:xii-terminal

# ─────────────────────────────────────────────────────────────
# KEY BINDINGS
# XII Super key = Windows key (SUPER / Meta)
# ─────────────────────────────────────────────────────────────
$SUPER = SUPER

# Launch XII Launcher (App Launcher)
bind = $SUPER, SPACE, exec, xii-launcher

# Launch XII Terminal
bind = $SUPER, RETURN, exec, xii-terminal
bind = $SUPER SHIFT, RETURN, exec, foot  # Fallback terminal

# Launch XII Files
bind = $SUPER, E, exec, xii-files

# Launch XII Settings
bind = $SUPER, COMMA, exec, xii-settings

# XII AI Assistant
bind = $SUPER, A, exec, xii-ai

# Screenshot
bind = , PRINT, exec, xii-screenshot
bind = SHIFT, PRINT, exec, xii-screenshot --region
bind = $SUPER, PRINT, exec, xii-screenshot --window

# Lock screen
bind = $SUPER, L, exec, swaylock

# Window management
bind = $SUPER, Q, killactive
bind = $SUPER SHIFT, Q, exit
bind = $SUPER, F, fullscreen, 0
bind = $SUPER SHIFT, F, fullscreen, 1  # Fake fullscreen
bind = $SUPER, V, togglefloating
bind = $SUPER, P, pseudo                # Pseudotile (dwindle)
bind = $SUPER, J, togglesplit           # Toggle split direction

# Move focus
bind = $SUPER, H, movefocus, l
bind = $SUPER, L, movefocus, r
bind = $SUPER, K, movefocus, u
bind = $SUPER, J, movefocus, d
bind = $SUPER, left,  movefocus, l
bind = $SUPER, right, movefocus, r
bind = $SUPER, up,    movefocus, u
bind = $SUPER, down,  movefocus, d

# Move windows
bind = $SUPER SHIFT, H, movewindow, l
bind = $SUPER SHIFT, L, movewindow, r
bind = $SUPER SHIFT, K, movewindow, u
bind = $SUPER SHIFT, J, movewindow, d

# Resize windows (submap)
bind = $SUPER, R, submap, resize
submap = resize
binde = , right, resizeactive, 20 0
binde = , left,  resizeactive, -20 0
binde = , up,    resizeactive, 0 -20
binde = , down,  resizeactive, 0 20
binde = , L, resizeactive, 20 0
binde = , H, resizeactive, -20 0
binde = , K, resizeactive, 0 -20
binde = , J, resizeactive, 0 20
bind = , escape, submap, reset
bind = , RETURN, submap, reset
submap = reset

# Workspaces 1-10
bind = $SUPER, 1, workspace, 1
bind = $SUPER, 2, workspace, 2
bind = $SUPER, 3, workspace, 3
bind = $SUPER, 4, workspace, 4
bind = $SUPER, 5, workspace, 5
bind = $SUPER, 6, workspace, 6
bind = $SUPER, 7, workspace, 7
bind = $SUPER, 8, workspace, 8
bind = $SUPER, 9, workspace, 9
bind = $SUPER, 0, workspace, 10

# Move active window to workspace
bind = $SUPER SHIFT, 1, movetoworkspace, 1
bind = $SUPER SHIFT, 2, movetoworkspace, 2
bind = $SUPER SHIFT, 3, movetoworkspace, 3
bind = $SUPER SHIFT, 4, movetoworkspace, 4
bind = $SUPER SHIFT, 5, movetoworkspace, 5
bind = $SUPER SHIFT, 6, movetoworkspace, 6
bind = $SUPER SHIFT, 7, movetoworkspace, 7
bind = $SUPER SHIFT, 8, movetoworkspace, 8
bind = $SUPER SHIFT, 9, movetoworkspace, 9
bind = $SUPER SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $SUPER, S, togglespecialworkspace, scratch
bind = $SUPER SHIFT, S, movetoworkspace, special:scratch

# Scroll through workspaces
bind = $SUPER, mouse_down, workspace, e+1
bind = $SUPER, mouse_up,   workspace, e-1
bind = $SUPER, Tab, workspace, e+1

# Move/resize with mouse
bindm = $SUPER, mouse:272, movewindow    # Super + LMB = drag
bindm = $SUPER, mouse:273, resizewindow  # Super + RMB = resize

# Volume control
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness control
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# XII Performance Mode quick-switch
bind = $SUPER CTRL, 1, exec, sudo xii-mode set lite
bind = $SUPER CTRL, 2, exec, sudo xii-mode set standard
bind = $SUPER CTRL, 3, exec, sudo xii-mode set performance
